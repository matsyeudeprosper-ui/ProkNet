# Memory settings are deliberately small: the build box has 12 GB RAM shared
# with live services. Do not raise these without checking free RAM first.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000
org.gradle.configuration-cache=false
# Run the Kotlin compiler inside the Gradle daemon instead of a second JVM.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=false
android.nonTransitiveRClass=true

# Never let AGP reach out to download SDK parts during a build: missing
# components must fail loudly and be installed with sdkmanager instead.
android.builder.sdkDownload=false
